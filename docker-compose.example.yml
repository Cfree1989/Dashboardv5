# 3D Print Management System - Docker Compose Example Configuration
# 
# This file provides example configurations for different deployment scenarios.
# Copy and modify according to your specific requirements.
#
# USAGE:
# 1. Copy this file to docker-compose.yml
# 2. Create .env file from env.example
# 3. Modify services and environment variables as needed
# 4. Run: docker-compose up -d

version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  # =============================================================================
  # BACKEND SERVICE
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Use Dockerfile.prod for production builds
    ports:
      - "5000:5000"  # Expose backend API
    networks:
      - app-network
    
    # Resource limits (adjust based on your server capacity)
    deploy:
      resources:
        limits:
          memory: 1G      # Maximum memory usage
          cpus: '1.0'     # Maximum CPU usage
        reservations:
          memory: 512M    # Guaranteed memory
          cpus: '0.5'     # Guaranteed CPU
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "/app/health_check.sh"]
      interval: 30s       # Check every 30 seconds
      timeout: 15s        # Timeout after 15 seconds
      retries: 3          # Retry 3 times before marking unhealthy
      start_period: 40s   # Wait 40s before first check
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Max log file size
        max-file: "3"     # Keep 3 log files
    
    # Security settings
    security_opt:
      - "no-new-privileges:true"  # Prevent privilege escalation
    
    # Environment variables (loaded from .env file)
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # Email configuration
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      
      # Application URLs
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL}
      
      # Workstation authentication
      - WORKSTATION_DEVELOPMENT=${WORKSTATION_DEVELOPMENT}
      - WORKSTATION_1=${WORKSTATION_1}
      - WORKSTATION_2=${WORKSTATION_2}
      - WORKSTATION_3=${WORKSTATION_3}
      
      # File handling
      - STORAGE_PATH=/app/storage
      - ALLOWED_FILE_EXTENSIONS=${ALLOWED_FILE_EXTENSIONS:-stl,obj,3mf,form,idea}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MIN_FILE_SIZE_KB=${MIN_FILE_SIZE_KB:-1}
      - ATOMIC_FILE_OPERATIONS_ENABLED=${ATOMIC_FILE_OPERATIONS_ENABLED:-true}
      
      # Optional settings
      - APP_VERSION=${APP_VERSION:-v3.1.2}
      - ENVIRONMENT_BANNER=${ENVIRONMENT_BANNER}
      - ANALYTICS_CACHE_TTL=${ANALYTICS_CACHE_TTL:-60}
    
    # Volume mounts
    volumes:
      # Production: Only mount data directories, not source code
      - storage_data:/app/storage
      - ./scripts:/app/scripts:ro  # Read-only script access
      
      # Development: Uncomment to mount source code for hot reloading
      # - ./backend:/app
      # - ./storage:/app/storage
    
    # Service dependencies
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    restart: unless-stopped
    stop_grace_period: 30s  # Allow graceful shutdown

  # =============================================================================
  # FRONTEND SERVICE
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Use Dockerfile.prod for production builds
    ports:
      - "3000:3000"  # Expose frontend
    networks:
      - app-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Environment variables
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=${NODE_ENV:-production}
    
    # Volume mounts
    volumes:
      # Development: Uncomment for hot reloading
      # - ./frontend:/app
      # - /app/node_modules
      pass  # No volumes for production
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security
    security_opt:
      - "no-new-privileges:true"
    
    # Dependencies
    depends_on:
      backend:
        condition: service_healthy
    
    restart: unless-stopped
    stop_grace_period: 20s

  # =============================================================================
  # DATABASE SERVICE (PostgreSQL)
  # =============================================================================
  db:
    image: postgres:15-alpine
    networks:
      - app-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d 3d_print_system"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    
    # Environment variables
    environment:
      - POSTGRES_DB=3d_print_system
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      
      # PostgreSQL configuration
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    
    # Data persistence
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
      # Optional: Custom PostgreSQL configuration
      # - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
      
      # Optional: Initialization scripts
      # - ./init-scripts:/docker-entrypoint-initdb.d:ro
    
    # Port exposure (SECURITY: Only expose in development)
    # ports:
    #   - "127.0.0.1:5432:5432"  # Development only - remove for production
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security
    security_opt:
      - "no-new-privileges:true"
    
    restart: unless-stopped

  # =============================================================================
  # REDIS SERVICE (Cache and Queue)
  # =============================================================================
  redis:
    image: redis:7-alpine
    networks:
      - app-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    
    # Environment and command
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    
    # Data persistence (optional)
    volumes:
      - redis_data:/data
      
      # Optional: Custom Redis configuration
      # - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    
    # Port exposure (SECURITY: Only expose in development)
    # ports:
    #   - "127.0.0.1:6379:6379"  # Development only - remove for production
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security
    security_opt:
      - "no-new-privileges:true"
    
    restart: unless-stopped

  # =============================================================================
  # WORKER SERVICE (Background Tasks)
  # =============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Use Dockerfile.prod for production
    command: ["rq", "worker", "default", "--url", "redis://:${REDIS_PASSWORD}@redis:6379/0"]
    networks:
      - app-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Health check
    healthcheck:
      test: ["CMD", "rq", "info", "-u", "redis://:${REDIS_PASSWORD}@redis:6379/0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    # Environment variables
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      
      # Email settings for worker tasks
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      
      # Application settings
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL}
      - STORAGE_PATH=/app/storage
    
    # Volume mounts
    volumes:
      # Production: Only mount data directories
      - storage_data:/app/storage
      - ./scripts:/app/scripts:ro
      
      # Development: Uncomment for hot reloading
      # - ./backend:/app
      # - ./storage:/app/storage
    
    # Dependencies
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security
    security_opt:
      - "no-new-privileges:true"
    
    restart: unless-stopped
    stop_grace_period: 30s  # Allow tasks to complete

  # =============================================================================
  # NGINX REVERSE PROXY (Optional - for production)
  # =============================================================================
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   networks:
  #     - app-network
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #     - ./ssl:/etc/ssl:ro  # SSL certificates
  #   depends_on:
  #     - backend
  #     - frontend
  #   restart: unless-stopped

# =============================================================================
# VOLUMES (Data Persistence)
# =============================================================================
volumes:
  # PostgreSQL data persistence
  postgres_data:
    driver: local
    # Optional: Use external storage for production
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /opt/3d-print-system/data/postgres

  # Redis data persistence (optional)
  redis_data:
    driver: local
    # Optional: Use external storage for production
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /opt/3d-print-system/data/redis

  # Application storage (files, uploads, etc.)
  storage_data:
    driver: local
    # Optional: Use external storage for production
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /opt/3d-print-system/storage

# =============================================================================
# CONFIGURATION NOTES
# =============================================================================
#
# DEVELOPMENT SETUP:
# 1. Copy env.example to .env
# 2. Set FLASK_ENV=development
# 3. Uncomment volume mounts for source code
# 4. Optionally expose database/redis ports for direct access
# 5. Use: docker-compose up -d
#
# PRODUCTION SETUP:
# 1. Use strong passwords in .env
# 2. Set FLASK_ENV=production
# 3. Remove source code volume mounts
# 4. Don't expose database/redis ports
# 5. Consider adding nginx reverse proxy
# 6. Use external volumes for data persistence
# 7. Enable SSL/TLS
#
# SCALING:
# - Add more worker instances: docker-compose up -d --scale worker=3
# - Use external database/redis for multi-node setup
# - Add load balancer for multiple backend instances
#
# MONITORING:
# - Add monitoring services (Prometheus, Grafana)
# - Configure log aggregation (ELK stack)
# - Set up alerting for critical services
#
# SECURITY:
# - Run services as non-root users
# - Use secrets management for sensitive data
# - Regular security updates
# - Network segmentation
# - SSL/TLS for all external communications
#
# =============================================================================
