[main]
# IMPORTANT: This path must match the exact drive letter and directory used by the backend and all staff PCs
# Example for Windows network drive mapping:
AUTHORITATIVE_STORAGE_BASE_PATH = Z:\\storage

# Log file location (ensure the directory exists or is creatable)
LOG_PATH = C:\\ProgramData\\SlicerOpener\\sliceropener.log

[slicer_prusa]
name = PrusaSlicer
path = C:\\Program Files\\Prusa3D\\PrusaSlicer\\prusa-slicer.exe
extensions = .stl,.3mf,.obj

[slicer_formlabs]
name = PreForm
path = C:\\Program Files\\Formlabs\\PreForm\\PreForm.exe
extensions = .form,.stl


