networks:
  app-network:
    driver: bridge

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "5000:5000"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL}
      - WORKSTATION_DEVELOPMENT=${WORKSTATION_DEVELOPMENT}
      - WORKSTATION_1=${WORKSTATION_1}
      - WORKSTATION_2=${WORKSTATION_2}
      - WORKSTATION_3=${WORKSTATION_3}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      # Production: Only mount data directories, not source code
      - ./storage:/app/storage
      - ./scripts:/app/scripts
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d 3d_print_system"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - POSTGRES_DB=3d_print_system
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Production: No exposed ports - internal access only
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # Production: No exposed ports - internal access only
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: rq worker --url redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      # Production: Only mount data directories, not source code
      - ./storage:/app/storage
      - ./scripts:/app/scripts
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
